name: CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-security:
    name: Typecheck & Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            web/package.json
            mobile/package.json

      - name: Install Dependencies
        run: |
          npm --prefix backend ci
          npm --prefix web ci
          npm --prefix mobile ci --legacy-peer-deps

      - name: Typecheck Backend
        run: npm --prefix backend run build

      - name: Typecheck Web Admin
        run: npx --prefix web tsc -p web/tsconfig.json --noEmit

      - name: Typecheck Mobile POS
        run: npx --prefix mobile tsc -p mobile/tsconfig.json --noEmit

      - name: Security Audit (High/Critical)
        run: |
          npm --prefix backend audit --omit=dev --audit-level=high || true
          npm --prefix web audit --omit=dev --audit-level=high || true

  test-backend:
    name: Backend Test Suite (RLS Fail-Closed, P0 Security & E2E)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: vuelto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Run Database Migrations & Clean SuperAdmin Seed
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/vuelto_test
          NODE_ENV: test
          SEED_SUPERADMIN_PASSWORD: CI_SuperAdmin_Password_2026!
        run: npm --prefix backend run db:migrate

      - name: Run Vitest Suite (RLS, Security P0, E2E & Concurrency)
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/vuelto_test
          NODE_ENV: test
          SEED_SUPERADMIN_PASSWORD: CI_SuperAdmin_Password_2026!
          JWT_SECRET: ci-test-super-secret-jwt-key-2026-min-32ch!
          JWT_REFRESH_SECRET: ci-test-super-secret-refresh-key-2026-min32!
          ENCRYPTION_KEY: ci-test-256-bit-aes-key-for-totp-secrets-32!
          METRICS_TOKEN: ci-test-metrics-token-2026-secure
          PAYMENT_WEBHOOK_SECRET: ci-test-webhook-secret-2026-secure
          INTERNAL_ADMIN_TOKEN: ci-test-internal-admin-token-2026
          MOCK_PAYMENT_ENABLED: 'false'
        run: npm --prefix backend test

  build-monorepo:
    name: Build Full Monorepo & Sync Static SPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Web + Backend
        run: |
          npm --prefix web ci
          npm --prefix backend ci
          npm run build
