services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vuelto-app:latest
    container_name: vuelto-app
    restart: always
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgres://${DB_USER:-vuelto_user}:${DB_PASSWORD:-VueltoSecureDb2026!}@db:5432/${DB_NAME:-vuelto_db}
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-vuelto-2026-production-min32chars}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-super-secret-refresh-key-vuelto-2026-min32chars}
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - MOCK_PAYMENT_ENABLED=${MOCK_PAYMENT_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: vuelto-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-vuelto_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-VueltoSecureDb2026!}
      POSTGRES_DB: ${DB_NAME:-vuelto_db}
    volumes:
      - vuelto_pgdata:/var/lib/postgresql/data
      - ./supabase_setup.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vuelto_user} -d ${DB_NAME:-vuelto_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vuelto_pgdata:
    driver: local
